name: Build Forza AI Mouse APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'forza-ai-mouse.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: unzip -q forza-ai-mouse.zip -d source

      - name: Build APK
        working-directory: source/forza-ai-mouse/android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Forza-AI-Mouse-APK
          path: source/forza-ai-mouse/android/app/build/outputs/apk/debug/app-debug.apk
